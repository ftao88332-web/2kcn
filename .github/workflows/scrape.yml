name: scrape

on:
  schedule:
    # UTC 时间；北京时间 = UTC+8 → 10:20 与 22:20 各跑一次
    - cron: "20 2 * * *"
    - cron: "20 14 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCRAPE_DELAY: "1.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r scraper/requirements.txt

      - name: 补齐 2K27 全量卡（列表接口枚举，断点续跑）
        run: python -m scraper.main full27 --limit 300 --delay 0.5

      - name: 实时行情（tRPC 活跃卡 + 高总评 → prices.json）
        run: python -m scraper.main market

      - name: 生成站点数据（cards_full.json → cards.json / cards_index.json）
        run: python scripts/build_index.py

      - name: 提交数据回仓库（cards_full.json / prices.json / 卡图）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data(t): daily sync ${{ github.run_id }}"
          file_pattern: "scraper/out/cards_full.json site/public/data/prices.json site/public/img"

  # GITHUB_TOKEN 的 push 不触发其他 workflow，所以部署作为同一 run 的下游 job
  deploy:
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_BASE_PATH: /2kcn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        working-directory: site

      - name: 生成站点数据
        run: python scripts/build_index.py

      - name: 保留线上更新的行情（15 分钟快照不被整站发布覆盖）
        run: python scripts/keep_prices.py

      - name: 构建（静态导出）
        run: npm run build
        working-directory: site

      - name: 发布到 gh-pages（git push，单次 pack，不受 API 限额影响）
        run: |
          cd site/out
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "publish: $(date -u +%F_%T)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
