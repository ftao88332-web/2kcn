name: prices

# 每 15 分钟只更新行情文件，不重建整站（前端运行时 fetch prices.json）。
on:
  schedule:
    # 避开 :00/:15/:30/:45（GitHub 整点最拥堵，*/15 常被延迟甚至丢跑）
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRAPE_DELAY: "0.6"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # 只取行情需要的文件：仓库里 100+MB 卡图不下载，96 次/天的定时任务才跑得快。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scraper
            scripts
            site/public/data
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r scraper/requirements.txt

      - name: 抓取实时行情
        run: python -m scraper.main market

      - name: 发布到 gh-pages（只更新 /data/prices.json）
        run: python scripts/publish_prices.py
