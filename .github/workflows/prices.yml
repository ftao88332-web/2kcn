name: prices

# 每 15 分钟只更新行情文件，不重建整站（前端运行时 fetch prices.json）。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRAPE_DELAY: "0.6"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r scraper/requirements.txt

      - name: 抓取实时行情
        run: python -m scraper.main market

      - name: 发布到 gh-pages（只更新 /data/prices.json）
        run: python scripts/publish_prices.py
