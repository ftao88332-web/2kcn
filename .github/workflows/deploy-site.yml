name: deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scraper/out/cards_full.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_BASE_PATH: /2kcn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        working-directory: site

      - name: 生成站点数据
        run: python scripts/build_index.py

      - name: 构建（静态导出）
        run: npm run build
        working-directory: site

      - name: 发布到 gh-pages（git push，单次 pack，不受 API 限额影响）
        run: |
          cd site/out
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "publish: $(date -u +%F_%T)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
