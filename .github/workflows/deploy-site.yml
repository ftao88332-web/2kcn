name: deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scraper/out/cards_full.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /2kcn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        working-directory: site

      - name: 构建（静态导出）
        run: npm run build
        working-directory: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 增量发布 gh-pages（Git Data API）
        run: |
          pip install "httpx>=0.27,<1.0"
          python scripts/publish_api.py site/out
        env:
          GH_TOKEN: ${{ github.token }}
